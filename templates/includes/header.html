<header class="bg-white shadow-sm">
    <nav class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
        <a href="/" class="text-xl font-bold text-gray-900">Packaging Market</a>

        <div class="flex items-center gap-6">
            <a href="/catalog/" class="text-gray-600 hover:text-gray-900">Каталог</a>
            <a href="/cart/" class="text-gray-600 hover:text-gray-900">Корзина</a>

            {% if user.is_authenticated %}
                <!--
                    Показываем имя пользователя со ссылкой на профиль.
                    get_short_name() возвращает имя, если есть, иначе телефон.
                -->
                <a href="{% url 'users:profile' %}" class="text-gray-700 hover:text-gray-900">
                    {{ user.get_short_name }}
                </a>

                <!--
                    Logout — GET-запрос для простоты.
                    В реальном проекте лучше POST, но для учебного ок.
                -->
                <a href="{% url 'users:logout' %}" class="text-red-600 hover:text-red-800">
                    Выйти
                </a>
            {% else %}
                <a href="{% url 'users:login' %}" class="text-blue-600 hover:text-blue-800">
                    Войти
                </a>
                <a href="{% url 'users:register' %}" class="text-green-600 hover:text-green-800">
                    Регистрация
                </a>
            {% endif %}
        </div>
    </nav>
</header>
